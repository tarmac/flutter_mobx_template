name: flutter_mobx_template
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  flutter: ">=3.41.6 <4.0.0"
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Http client
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # State management:
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  get_it: ^8.2.0
  intl: ^0.20.2

  # Data
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Env
  flutter_flavorizr: ^2.4.1

  # Lint
  flutter_lints: ^6.0.0

  # Data
  build_runner: ^2.10.1
  json_serializable: ^6.11.1
  mobx_codegen: ^2.7.4

  # Test
  mockito: ^5.5.1
  faker: ^2.2.0

flutter:
  uses-material-design: true

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:
  ide: idea
  instructions:
    - assets:download
    - assets:extract
    - android:androidManifest
    - android:buildGradle
    - flutter:flavors
    - flutter:app
    - flutter:targets
    - ios:xcconfig
    - ios:buildTargets
    - ios:schema
    - ios:plist
    - assets:clean
    - ide:config

  flavors:
    dev:
      app:
        name: "SecretWall dev"
      android:
        applicationId: "com.example.flutter_mobx_template.dev"
      ios:
        bundleId: "com.example.flutter_mobx_template.dev"
    qa:
      app:
        name: "SecretWall qa"
      android:
        applicationId: "com.example.flutter_mobx_template.qa"
      ios:
        bundleId: "com.example.flutter_mobx_template.qa"
    prod:
      app:
        name: "SecretWall"
      android:
        applicationId: "com.example.flutter_mobx_template"
      ios:
        bundleId: "com.example.flutter_mobx_template"
